[package]
name = "xwc"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A small wc-style command line tool"
license = "MIT"
include = ["Cargo.lock", "Cargo.toml", "LICENSE", "README.md", "src/**/*", "tests/**/*"]

[dependencies]
bytesize = "2"
clap = { version = "4", features = ["derive"] }
memchr = "2"

[dev-dependencies]
assert_cmd = "2"
divan = { package = "codspeed-divan-compat", version = "4" }
tempfile = "3"

[[bench]]
name = "count"
harness = false
