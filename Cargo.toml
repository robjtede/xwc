[package]
name = "xwc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small wc-style command line tool"
license = "MIT"
include = ["Cargo.lock", "Cargo.toml", "LICENSE", "README.md", "src/**/*", "tests/**/*"]

[dependencies]
bytesize = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
divan = "0.1"

[[bench]]
name = "count"
harness = false
